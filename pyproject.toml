[project]
name = "iot-service-discovery"
version = "0.1.0"
description = "Educational comparison of CoAP, mDNS and SSDP service discovery under emulated network conditions (GNS3)."
readme = "README.md"
authors = [
    { name = "Vinícius Amorim S. Rozario" }
]
requires-python = ">=3.12"
dependencies = [
    "aiocoap>=0.4.17",
    "zeroconf>=0.154.0",
    "ssdpy>=0.4.1",
]

[project.scripts]
iot-service-discovery = "iot_service_discovery:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
